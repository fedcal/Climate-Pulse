[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "climatepulse-api"
version = "0.1.0"
description = "Climate Pulse FastAPI application — /healthz + /readyz endpoints (Phase 1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.136.*",
    "uvicorn[standard]==0.47.*",
    "climatepulse-core",
]

[tool.uv.sources]
climatepulse-core = { workspace = true }

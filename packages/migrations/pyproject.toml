[project]
name = "climatepulse-migrations"
version = "0.1.0"
description = "Climate Pulse Alembic migrations for TimescaleDB schema"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "climatepulse-core",
]

[tool.uv.sources]
climatepulse-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["climatepulse_migrations"]

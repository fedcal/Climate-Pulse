# Alembic configuration for Climate Pulse migrations.
# Run migrations via:
#   alembic -c packages/migrations/alembic.ini upgrade head
#
# The sqlalchemy.url is intentionally left empty; env.py reads DATABASE_URL
# from the environment variable instead.

[alembic]
script_location = climatepulse_migrations
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is empty — env.py reads from DATABASE_URL environment variable
sqlalchemy.url =

[post_write_hooks]
# Uncomment to run ruff format on new migration files:
# hooks = ruff
# ruff.type = exec
# ruff.executable = %(here)s/.venv/bin/ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

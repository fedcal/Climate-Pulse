[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "climatepulse-core"
version = "0.1.0"
description = "Climate Pulse core library — adapters, normalizer, polite HTTP client, storage writer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "httpx==0.28.*",
    "tenacity==9.1.*",
    "aiocache==0.12.*",
    "pyrate-limiter==4.1.*",
    "pint==0.25.*",
    "pydantic>=2.9",
    "pydantic-settings==2.14.*",
    "sqlalchemy[asyncio]==2.0.*",
    "asyncpg==0.31.*",
    "sqlalchemy-timescaledb>=0.4",
    "structlog==25.5.*",
    "redis<6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["climatepulse_core"]

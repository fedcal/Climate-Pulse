site_name: Climate Pulse
site_url: https://fedcal.github.io/Climate-Pulse
repo_url: https://github.com/fedcal/Climate-Pulse
repo_name: fedcal/Climate-Pulse

copyright: "Climate Pulse · MIT License · <a href='https://federicocalo.dev'>federicocalo.dev</a>"

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: light-blue
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Scraping Policy: scraping-policy.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [packages/core]
